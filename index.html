<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .pdf-section {
        position: fixed;
        top: 0;
    }

    .content {
        display: flex;
        gap: 30px;
    }

    .table-content {
        flex: 1;
    }

    .task-table {
        width: 100%;
        border-radius: 10px;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.15),
            0 12px 30px rgba(0, 0, 0, 0.12);

        background-color: white;
    }

    .task-table thead tr {
        background-color: rgb(4, 6, 37);
        color: white;
    }

    .task-content {
        flex: 1;
    }

    .table-content,
    .task-content {
        display: flex;
        flex-direction: column;
    }

    .amet,
    .action-content {
        height: 60px;
        display: flex;
        align-items: center;
    }

    .task-table td {
        padding: 15px;
        font-size: larger;
        text-align: center;
    }

    .task-table tbody tr:nth-child(even) {
        background-color: whitesmoke;
    }

    .buttons-section {
        display: flex;
        gap: 15px;
    }

    .buttons-section button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;

        color: white;
        text-shadow: 1px 1px #000000;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
    }

    .startBtn {
        background: greenyellow;
        cursor: pointer;
        transition: box-shadow 0.2s ease;
    }

    .button-disabled {
        background-color: lightgray;

        cursor: not-allowed;
    }

    .endBtn {
        background: red;
        cursor: pointer;
        transition: box-shadow 0.2s ease;
    }

    .startBtn:hover,
    .endBtn:hover,
    .pauseBtn:hover,
    .resumeBtn:hover {
        box-shadow: 2px 2px #000000;
    }

    .action-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding-bottom: 5px;
    }

    .amet {
        margin: 0px;
        margin-bottom: 10px;
        font-size: x-large;
        text-align: center;
        font-weight: bold;
    }

    .task-table tbody tr {
        transition:
            background-color 0.2s ease,
            transform 0.15s ease;
    }

    .task-table tbody tr:hover {
        background-color: rgb(220, 235, 255);
        transform: scale(1.01);
        cursor: pointer;
    }

    .pdf-wrapper {
        top: 20px;
        align-self: flex-start;
    }

    .pdf-content {
        display: flex;
        flex-direction: column;

        height: calc(100vh - 40px);
        overflow-y: auto;
        overflow-x: hidden;

        box-shadow:
            0 6px 12px rgba(0, 0, 0, 0.18),
            0 16px 40px rgba(0, 0, 0, 0.15);
    }

    #pdfViewer canvas {
        display: block;
        max-width: 100%;
        margin: 0 auto 20px auto;
    }

    .task-table tbody tr.selected {
        background-color: rgb(187, 222, 251);
    }

    .task-table tbody tr.selected:hover {
        background-color: rgb(187, 222, 251);
    }

    .fullscreen-btn {
        top: 1px;

        align-self: flex-end;

        z-index: 1000;

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 8px;

        background: rgba(4, 6, 37, 0.85);
        color: white;
        font-size: 20px;

        cursor: pointer;
        transition: background .2s;

        position: sticky;
        top: 0;
    }

    .fullscreen-btn:hover {
        background: rgba(4, 6, 37, 1);
    }

    #pdfContainer:fullscreen {
        width: 100vw;
        height: 100vh;
        background: white;
        overflow-y: auto;
    }

    #pdfContainer:fullscreen #pdfViewer canvas {
        max-width: 100%;
        height: auto;
    }

    .pdf-content.expanded {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        background: white;
    }

    .overlay {
        position: fixed;
        background-color: rgba(0, 0, 0, 0.6);
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 99999;
    }

    .task-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 230px;
        background-color: white;
        border-radius: 10px;
        border: none;
        box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.5);
    }

    .taskRows {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 20px;
        padding-top: 40px;
        width: 65%;
    }

    .task-row {
        display: flex;
        justify-content: space-between;
    }

    .task-row input {
        border-radius: 8px;
        border: none;
        box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 40px;
        height: 30px;
    }

    .task-row input::target-text {
        font-size: 32px;
    }

    .task-row p {
        font-size: 20px;
        margin: 0px;
        margin-top: 4px;
        vertical-align: center;
    }

    .taskBtn {
        cursor: pointer;
    }

    .popup-close {
        position: absolute;
        right: 2px;
        top: 2px;
        cursor: pointer;
        padding: 5px 10px 5px 10px;
        color: red;
        background-color: rgba(0, 0, 0, 0);
        border: 1px solid red;
        border-radius: 25px;
        transition: box-shadow 0.15s ease-in-out;
    }

    .popup-close:hover {
        box-shadow: 0px 0px 4px rgba(255, 0, 0, 0.6);
    }

    .popup-save {
        margin-top: 10px;
        padding: 8px 14px 8px 14px;
        cursor: pointer;
        background-color: rgb(7, 62, 214);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        transition: opacity 0.1s ease-in;
    }

    .popup-save:hover {
        opacity: 0.7;
    }

    .salvesta-btn {
        padding: 10px 15px 10px 15px;
        background-color: rgb(6, 63, 221);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    .pauseBtn {
        background-color: yellow;
        color: white;
        cursor: pointer;
    }

    .resumeBtn {
        color: white;
        cursor: pointer;
    }
</style>

<body>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

</body>

<script type="module">

    import { DataFetcher } from "./DataFetcher.js";
    import { Order } from "./Order.js";
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

    const fetcher = new DataFetcher();

    const orders = await fetcher.getOrders();

    Order.currentOrders = orders;

    await setupButtonEvents();

    let task_table = document.getElementById("task-table");

    let table_body = document.querySelector(".task-table tbody");

    for (let i = 0; i < orders.length; ++i) {

        const order = orders[i];

        if (order.containsComment("valmis"))
            continue;
        if (order.isRemoved())
            continue;

        let pdfBytes = null;

        let table_row = document.createElement("tr");

        table_row.innerHTML = `
            <td>${order.getTNr()}</td>
            <td>${order.getMaterial()}</td>
            <td>${order.getSoNr()}</td>
            <td>${order.getClient()}</td>
            <td>${order.getTask()}</td>
            <td>${Math.trunc(order.getAmount())}</td>
        `;

        table_row.id = order.getGuid();

        table_row.addEventListener("click", async () => {

            if (!table_row.classList.contains("selected")) {
                pdfBytes = await fetcher.getObjectPDFBytes(order.getGuid());

                Order.selectedOrder = await fetcher.getOrderByGUID(order.getGuid());

                if (pdfBytes) {
                    await loadPdf(pdfBytes);
                }

                refreshButtons();

                console.log(`${Order.selectedOrder.getTNr()}`);
            }

            document
                .querySelectorAll(".task-table tbody tr")
                .forEach(row => row.classList.remove("selected"));

            table_row.classList.add("selected");
        });

        table_body.appendChild(table_row);
    }

    const firstRow = document.querySelector(".task-table tbody tr");

    if (firstRow) {
        firstRow.click();
    }

    const intervalID = setInterval(updateTable, 10000);

    const pdfContainer = document.getElementById("pdfContainer");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    fullscreenBtn.addEventListener("click", () => {
        pdfContainer.classList.toggle("expanded");
    });

    async function loadPdf(pdfBytes) {

        const viewer = document.getElementById("pdfViewer");

        viewer.innerHTML = "";

        const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(pdfBytes),
            disableAutoFetch: true,
            disableStream: true
        });

        const pdf = await loadingTask.promise;

        const selectedOrder = Order.selectedOrder;

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

            const page = await pdf.getPage(pageNumber);

            const textContent = await page.getTextContent();

            const viewport = page.getViewport({
                scale: 1.5
            });

            const pageContainer = document.createElement("div");
            pageContainer.style.position = "relative";
            pageContainer.style.width = `${viewport.width}px`;
            pageContainer.style.height = `${viewport.height}px`;

            const startIndex = textContent.items.findIndex(item => (item.str.includes("Valmistaja:") && item.transform[5] > 700)) + 2;
            let endIndex = textContent.items.findIndex(item => (item.str.includes("Katseraport")));

            if (endIndex == -1) {
                endIndex = textContent.items.length;
            }

            const found = textContent.items.find(item =>
                item.str.includes("Tellimus valmis:")
            );

            if (found && found.transform[5] > 700) {

                const hasTaskFieldsJSON = await fetcher.hasTaskFieldsJSON(selectedOrder.getGuid());

                if (hasTaskFieldsJSON) {
                    const jsonBytes = await fetcher.getObjectJSONBytes(selectedOrder.getGuid());

                    const jsonString = new TextDecoder().decode(jsonBytes);

                    const fieldsList = JSON.parse(jsonString);

                    for (let fieldObj of fieldsList) {
                        createField(
                            pageContainer,
                            fieldObj.x,
                            fieldObj.y,
                            fieldObj.value
                        );

                        if (fieldObj.value.includes("Pakime")) {
                            await createSalvestaButton(fieldObj.x - 7, fieldObj.y + 15, pageContainer, fetcher);
                        }
                    }

                } else {
                    let cleanedItems = textContent.items.slice(startIndex, endIndex);
                    for (let item of cleanedItems) {
                        const tx = pdfjsLib.Util.transform(
                            viewport.transform,
                            item.transform
                        );

                        createField(
                            pageContainer,
                            tx[4],
                            tx[5],
                            item.str
                        );

                        if (item.str.includes("Pakime")) {
                            await createSalvestaButton(tx[4] - 7, tx[5] + 15, pageContainer, fetcher);
                        }

                    }
                }

                /*
                textContent.items.forEach(item => {
                    const tx = pdfjsLib.Util.transform(
                        viewport.transform,
                        item.transform
                    );

                    createField(
                        pageContainer,
                        tx[4],
                        tx[5],
                        item.str
                    );

                    if (item.str.includes("Pakime")) {
                        await createSalvestaButton(tx[4] - 7, tx[5] + 15, pageContainer, fetcher);
                        
                        let salvestaBtn = createButton(
                            pageContainer,
                            tx[4] - 7,
                            tx[5] + 15,
                            "salvesta-btn",
                            "Salvesta"
                        );
                        salvestaBtn.addEventListener("click", async () => {
                            const allFields = document.querySelectorAll(".task-field");

                            let fieldsList = [];

                            for (const field of allFields) {
                                console.log(field.value);

                                const x = parseFloat(field.style.left);
                                const y = parseFloat(field.style.top);

                                fieldsList.push({
                                    "value": field.value,
                                    "x": x,
                                    "y": y
                                });

                            }
                            const jsonFields = JSON.stringify(fieldsList, null, 4);
                            const jsonBytes = new TextEncoder().encode(jsonFields);

                            if (!(await fetcher.hasTaskFields(selectedOrder.getGuid()))) {
                                await fetcher.createJsonFile(selectedOrder.getGuid(), jsonBytes);
                            } else {
                                await fetcher.replaseJsonFile(selectedOrder.getGuid(), await fetcher.getOrderFileGUID(selectedOrder, "taskFields"), jsonBytes);
                            }
                        });
                        
                    }

                });
                */
            }

            viewer.appendChild(pageContainer);

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            pageContainer.appendChild(canvas);

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;
        }
    }

    async function createSalvestaButton(x, y, pageContainer, fetcher) {

        const selectedOrder = Order.selectedOrder;

        let salvestaBtn = createButton(
            pageContainer,
            x,
            y,
            "salvesta-btn",
            "Salvesta"
        );
        salvestaBtn.addEventListener("click", async () => {
            const allFields = document.querySelectorAll(".task-field");

            let fieldsList = [];

            for (const field of allFields) {
                console.log(field.value);

                const x = parseFloat(field.style.left);
                const y = parseFloat(field.style.top) + 24;

                fieldsList.push({
                    "value": field.value,
                    "x": x,
                    "y": y
                });

            }
            const jsonFields = JSON.stringify(fieldsList, null, 4);
            const jsonBytes = new TextEncoder().encode(jsonFields);

            if (!(await fetcher.hasTaskFieldsJSON(selectedOrder.getGuid()))) {
                await fetcher.createJsonFile(selectedOrder.getGuid(), jsonBytes);
            } else {
                console.log(selectedOrder.getGuid());
                await fetcher.replaceJsonFile(selectedOrder.getGuid(), await fetcher.getOrderFileGUID(selectedOrder.getGuid(), "taskFields"), jsonBytes);
            }
        });
    }


    function createField(container, x, y, text) {

        if (!text || text.trim() === "") return;

        const input = document.createElement("input");

        input.type = "text";

        input.style.position = "absolute";
        input.style.left = `${x}px`;
        input.style.top = `${y - 24}px`;
        input.style.fontSize = `18px`;
        input.style.borderRadius = "8px";
        input.style.border = "1px solid black";
        input.style.height = "25px";
        input.className = "task-field";

        let inputWidth = text.length * 14;

        if (inputWidth > 330) {
            inputWidth = 330;
        }

        input.style.width = `${inputWidth}px`;

        input.value = text;

        container.appendChild(input);
    }

    function createButton(container, x, y, className, value) {
        let btn = document.createElement("button");
        btn.style.position = "absolute";
        btn.style.left = `${x}px`;
        btn.style.top = `${y}px`;
        btn.style.fontSize = `18px`;
        btn.className = className;
        btn.textContent = value;
        btn.id = className;

        container.appendChild(btn);

        return btn;
    }

    async function updateTable() {

        const fetcher = new DataFetcher();

        const newOrders = await fetcher.getOrders();

        let task_table = document.getElementById("task-table");

        let table_body = document.querySelector(".task-table tbody");

        const currentOrders = Order.currentOrders;

        if (currentOrders.length < newOrders.length) {

            for (let i = currentOrders.length; i < newOrders.length; ++i) {

                const newOrder = newOrders[i];
                if (newOrder.containsComment("valmis"))
                    continue;
                if (newOrder.isRemoved())
                    continue;

                addRow(newOrder);

                Order.currentOrders.push(newOrder);

            }

        }
    }

    async function addRow(order) {

        if (order.containsComment("valmis"))
            return;
        if (order.isRemoved())
            return;

        let task_table = document.getElementById("task-table");

        let table_body = document.querySelector(".task-table tbody");

        let table_row = document.createElement("tr");

        table_row.innerHTML = `
                < td > ${order.getTNr()}</td >
            <td>${order.getMaterial()}</td>
            <td>${order.getSoNr()}</td>
            <td>${order.getClient()}</td>
            <td>${order.getTask()}</td>
            <td>${Math.trunc(order.getAmount())}</td>
        `;

        table_row.addEventListener("click", async () => {

            if (!table_row.classList.contains("selected")) {
                pdfBytes = await fetcher.getObjectPDFBytes(order.getGuid());

                if (pdfBytes) {
                    await loadPdf(pdfBytes);
                }
            }

            document
                .querySelectorAll(".task-table tbody tr")
                .forEach(row => row.classList.remove("selected"));

            table_row.classList.add("selected");

        });

        table_body.appendChild(table_row);

    }

    function existsToggleButton() {
        const toggleBtn = document.getElementById("toggleBtn");
        return toggleBtn != null;
    }

    function createToggleButton() {
        const toggleBtn = document.createElement("button");
        toggleBtn.textContent = "Peata";
        toggleBtn.className = "pauseBtn";
        toggleBtn.id = "toggleBtn";

        toggleBtn.addEventListener("click", () => {
            let textContent = toggleBtn.textContent;

            if (textContent == "Peata") {
                toggleBtn.textContent = "Jätka";
            } else if (textContent == "Jätka") {
                toggleBtn.textContent = "Peata";
            }
        });

        const btnSection = document.getElementById("buttons-section");
        btnSection.prepend(toggleBtn);
    }

    function deleteElement(id) {
        const el = document.getElementById(id);
        if (el != null) {
            el.remove();
        }
    }

    async function setupButtonEvents() {
        const startBtn = document.getElementById("startBtn");
        const endBtn = document.getElementById("endBtn");


        startBtn.addEventListener("click", async () => {
            await Order.selectedOrder.setStatus("W")
            await Order.selectedOrder.startTask();
            disableButton("startBtn");
            enableButton("endBtn");

            createToggleButton();
        });
        endBtn.addEventListener("click", async () => {
            await Order.selectedOrder.setStatus("D")
            await Order.selectedOrder.endTask();
            disableButton("endBtn");

            if (existsToggleButton()) {
                document.getElementById("toggleBtn").remove();
            }
        });
    }

    function disableButton(buttonId) {
        const button = document.getElementById(buttonId);
        button.className = "button-disabled";
        button.disabled = true;
    }

    function enableButton(buttonId) {
        const button = document.getElementById(buttonId);
        button.className = buttonId
        button.disabled = false;
    }

    function refreshButtons() {
        if (Order.selectedOrder.getStatus() == "W") {
            disableButton("startBtn");
            enableButton("endBtn");

            if (!existsToggleButton()) {
                createToggleButton();
            }
        } else {
            enableButton("startBtn");
            disableButton("endBtn");
            deleteElement("toggleBtn");
        }
    }

</script>

</html>
