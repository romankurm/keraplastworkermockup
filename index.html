<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .pdf-section {
        position: fixed;
        top: 0;
    }

    .content {
        display: flex;
        gap: 30px;
    }

    .table-content {
        flex: 1;
    }

    .task-table {
        width: 100%;
        border-radius: 10px;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.15),
            0 12px 30px rgba(0, 0, 0, 0.12);

        background-color: white;
    }

    .task-table thead tr {
        background-color: rgb(4, 6, 37);
        color: white;
    }

    .task-content {
        flex: 1;
    }

    .table-content,
    .task-content {
        display: flex;
        flex-direction: column;
    }

    .amet,
    .action-content {
        height: 60px;
        display: flex;
        align-items: center;
    }

    .task-table td {
        padding: 15px;
        font-size: larger;
        text-align: center;
    }

    .task-table tbody tr:nth-child(even) {
        background-color: whitesmoke;
    }

    .buttons-section {
        display: flex;
        gap: 15px;
    }

    .buttons-section button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;

        color: white;
        text-shadow: 1px 1px #000000;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
    }

    .startBtn {
        background: greenyellow;
        cursor: pointer;
        transition: box-shadow 0.2s ease;
    }

    .button-disabled {
        background-color: lightgray;

        cursor: not-allowed;
    }

    .end-btn {
        background: red;
        cursor: pointer;
        transition: box-shadow 0.2s ease;
    }

    .startBtn:hover,
    .end-btn:hover {
        box-shadow: 2px 2px #000000;
    }

    .action-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding-bottom: 5px;
    }

    .amet {
        margin: 0px;
        margin-bottom: 10px;
        font-size: x-large;
        text-align: center;
        font-weight: bold;
    }

    .task-table tbody tr {
        transition:
            background-color 0.2s ease,
            transform 0.15s ease;
    }

    .task-table tbody tr:hover {
        background-color: rgb(220, 235, 255);
        transform: scale(1.01);
        cursor: pointer;
    }

    .pdf-wrapper {
        top: 20px;
        align-self: flex-start;
    }

    .pdf-content {
        display: flex;
        flex-direction: column;

        height: calc(100vh - 40px);
        overflow-y: auto;
        overflow-x: hidden;

        box-shadow:
            0 6px 12px rgba(0, 0, 0, 0.18),
            0 16px 40px rgba(0, 0, 0, 0.15);
    }

    #pdfViewer canvas {
        display: block;
        max-width: 100%;
        margin: 0 auto 20px auto;
    }

    .task-table tbody tr.selected {
        background-color: rgb(187, 222, 251);
    }

    .task-table tbody tr.selected:hover {
        background-color: rgb(187, 222, 251);
    }

    .fullscreen-btn {
        top: 1px;

        align-self: flex-end;

        z-index: 1000;

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 8px;

        background: rgba(4, 6, 37, 0.85);
        color: white;
        font-size: 20px;

        cursor: pointer;
        transition: background .2s;

        position: sticky;
        top: 0;
    }

    .fullscreen-btn:hover {
        background: rgba(4, 6, 37, 1);
    }

    #pdfContainer:fullscreen {
        width: 100vw;
        height: 100vh;
        background: white;
        overflow-y: auto;
    }

    #pdfContainer:fullscreen #pdfViewer canvas {
        max-width: 100%;
        height: auto;
    }

    .pdf-content.expanded {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        background: white;
    }

    .overlay {
        position: fixed;
        background-color: rgba(0, 0, 0, 0.6);
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 99999;
    }

    .task-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 230px;
        background-color: white;
        border-radius: 10px;
        border: none;
        box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.5);
    }

    .taskRows {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 20px;
        padding-top: 40px;
        width: 65%;
    }

    .task-row {
        display: flex;
        justify-content: space-between;
    }

    .task-row input {
        border-radius: 8px;
        border: none;
        box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 40px;
        height: 30px;
    }

    .task-row input::target-text {
        font-size: 32px;
    }

    .task-row p {
        font-size: 20px;
        margin: 0px;
        margin-top: 4px;
        vertical-align: center;
    }

    .taskBtn {
        cursor: pointer;
    }

    .popup-close {
        position: absolute;
        right: 2px;
        top: 2px;
        cursor: pointer;
        padding: 5px 10px 5px 10px;
        color: red;
        background-color: rgba(0, 0, 0, 0);
        border: 1px solid red;
        border-radius: 25px;
        transition: box-shadow 0.15s ease-in-out;
    }

    .popup-close:hover {
        box-shadow: 0px 0px 4px rgba(255, 0, 0, 0.6);
    }

    .popup-save {
        margin-top: 10px;
        padding: 8px 14px 8px 14px;
        cursor: pointer;
        background-color: rgb(7, 62, 214);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        transition: opacity 0.1s ease-in;
    }

    .popup-save:hover {
        opacity: 0.7;
    }
</style>

<body>
    <div class="content">
        <div class="table-content">
            <p class="amet">L&otilde;ikamine</p>
            <table class="task-table">
                <thead>
                    <tr>
                        <td width="80">T Nr.</td>
                        <td width="30">Mat.</td>
                        <td width="50">SO</td>
                        <td width="170">Klient</td>
                        <td width="">T&ouml;&ouml;k&auml;sk</td>
                        <td>Kogus</td>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
        <div class="task-content">
            <div class="pdf-section">
                <div class="action-content">
                    <div class="buttons-section">
                        <button id="taskBtn" class="taskBtn">T&ouml;&ouml;k&auml;sk</button>
                        <button id="startBtn" class="startBtn">Alusta <svg xmlns="http://www.w3.org/2000/svg" width="16"
                                height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-flag-icon lucide-flag">
                                <path
                                    d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528" />
                            </svg></button>

                        <button id="endBtn" class="end-btn">L&otilde;peta <svg xmlns="http://www.w3.org/2000/svg"
                                width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-flag-off-icon lucide-flag-off">
                                <path d="M16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528" />
                                <path d="m2 2 20 20" />
                                <path d="M4 22V4" />
                                <path d="M7.656 2H8c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10.347" />
                            </svg></button>
                    </div>
                </div>
                <div class="pdf-wrapper">
                    <div class="pdf-content" id="pdfContainer">
                        <button id="fullscreenBtn" class="fullscreen-btn">
                            ⛶
                        </button>
                        <div id="pdfViewer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

</body>

<script type="module">

    import { DataFetcher } from "./DataFetcher.js";
    import { Order } from "./Order.js";
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

    const fetcher = new DataFetcher();

    const orders = await fetcher.getOrders();

    Order.currentOrders = orders;

    await setupButtonEvents();

    let task_table = document.getElementById("task-table");

    let table_body = document.querySelector(".task-table tbody");

    for (let i = 0; i < orders.length; ++i) {

        const order = orders[i];

        if (order.containsComment("valmis"))
            continue;
        if (order.isRemoved())
            continue;

        let pdfBytes = null;

        let table_row = document.createElement("tr");

        table_row.innerHTML = `
            <td>${order.getTNr()}</td>
            <td>${order.getMaterial()}</td>
            <td>${order.getSoNr()}</td>
            <td>${order.getClient()}</td>
            <td>${order.getTask()}</td>
            <td>${Math.trunc(order.getAmount())}</td>
        `;

        table_row.id = order.getGuid();

        table_row.addEventListener("click", async () => {

            if (!table_row.classList.contains("selected")) {
                pdfBytes = await fetcher.getObjectPDFBytes(order.getGuid());

                if (pdfBytes) {
                    await loadPdf(pdfBytes);
                }
                Order.selectedOrder = await fetcher.getOrderByGUID(order.getGuid());

                refreshButtons();

                console.log(`${Order.selectedOrder.getTNr()}`);
            }

            document
                .querySelectorAll(".task-table tbody tr")
                .forEach(row => row.classList.remove("selected"));

            table_row.classList.add("selected");
        });

        table_body.appendChild(table_row);
    }

    const firstRow = document.querySelector(".task-table tbody tr");

    if (firstRow) {
        firstRow.click();
    }

    const intervalID = setInterval(updateTable, 10000);

    const pdfContainer = document.getElementById("pdfContainer");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    fullscreenBtn.addEventListener("click", () => {
        pdfContainer.classList.toggle("expanded");
    });

    async function loadPdf(pdfBytes) {

        const viewer = document.getElementById("pdfViewer");

        viewer.innerHTML = "";

        const loadingTask = pdfjsLib.getDocument({
            data: pdfBytes.slice(0)
        });

        const pdf = await loadingTask.promise;

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

            const page = await pdf.getPage(pageNumber);

            const viewport = page.getViewport({
                scale: 1.5
            });

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            viewer.appendChild(canvas);

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;
        }
    }

    async function updateTable() {

        const fetcher = new DataFetcher();

        const newOrders = await fetcher.getOrders();

        let task_table = document.getElementById("task-table");

        let table_body = document.querySelector(".task-table tbody");

        const currentOrders = Order.currentOrders;

        if (currentOrders.length < newOrders.length) {

            for (let i = currentOrders.length; i < newOrders.length; ++i) {

                const newOrder = newOrders[i];
                if (newOrder.containsComment("valmis"))
                    continue;
                if (newOrder.isRemoved())
                    continue;

                addRow(newOrder);

                Order.currentOrders.push(newOrder);

            }

        }
    }

    async function addRow(order) {

        if (order.containsComment("valmis"))
            return;
        if (order.isRemoved())
            return;

        let task_table = document.getElementById("task-table");

        let table_body = document.querySelector(".task-table tbody");

        let table_row = document.createElement("tr");

        table_row.innerHTML = `
                < td > ${order.getTNr()}</td >
            <td>${order.getMaterial()}</td>
            <td>${order.getSoNr()}</td>
            <td>${order.getClient()}</td>
            <td>${order.getTask()}</td>
            <td>${Math.trunc(order.getAmount())}</td>
        `;

        table_row.addEventListener("click", async () => {

            if (!table_row.classList.contains("selected")) {
                pdfBytes = await fetcher.getObjectPDFBytes(order.getGuid());

                if (pdfBytes) {
                    await loadPdf(pdfBytes);
                }
            }

            document
                .querySelectorAll(".task-table tbody tr")
                .forEach(row => row.classList.remove("selected"));

            table_row.classList.add("selected");

        });

        table_body.appendChild(table_row);

    }

    async function setupButtonEvents() {
        const startBtn = document.getElementById("startBtn");
        const endBtn = document.getElementById("endBtn");
        const taskBtn = document.getElementById("taskBtn");


        startBtn.addEventListener("click", async () => {
            await Order.selectedOrder.setStatus("W")
            await Order.selectedOrder.startTask();
            disableButton("startBtn");
        });
        endBtn.addEventListener("click", async () => {
            await Order.selectedOrder.endTask();
        });
        taskBtn.addEventListener("click", async () => {
            console.log("clicked");
            let overlay = document.createElement("div");
            overlay.className = "overlay";

            overlay.innerHTML = `
            <div class="task-popup">
                <button id="popup-close" class="popup-close">X</button>
                <div class="taskRows">
                    <div class="task-row">
                        <p>Pikkus:</p>
                        <input type="text">
                    </div>
                    <div class="task-row">
                        <p>Laius:</p>
                        <input type="text">
                    </div>
                    <div class="task-row">
                        <p>Kõrgus:</p>
                        <input type="text">
                    </div>
                    <div class="task-row">
                        <button id="popup-save" class="popup-save">Salvesta</button>
                    </div>
                </div>
            </div>
            `;

            document.body.appendChild(overlay);

            const popupCloseBtn = document.getElementById("popup-close");

            popupCloseBtn.addEventListener("click", () => {
                overlay.remove();
            });
        });
    }

    function disableButton(buttonId) {
        const button = document.getElementById(buttonId);
        button.className = "button-disabled";
        button.disabled = true;
    }

    function enableButton(buttonId) {
        const button = document.getElementById(buttonId);
        button.className = buttonId
        button.disabled = false;
    }

    function refreshButtons() {
        if (Order.selectedOrder.getStatus() == "W") {
            disableButton("startBtn");
        } else {
            enableButton("startBtn");
        }
    }

</script>

</html>
